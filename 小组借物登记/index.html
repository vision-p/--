<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>小组借物登记</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="workspace">
        <header class="hero">
            <h1>小组借物登记</h1>
            <p>借还记录保存在本地数据库</p>
        </header>

        <dl class="overview" aria-label="物品统计">
            <div class="stat"><dt>全部物品</dt><dd id="totalCount">0</dd></div>
            <div class="stat"><dt>可借</dt><dd id="availableCount">0</dd></div>
            <div class="stat"><dt>已借出</dt><dd id="borrowedCount">0</dd></div>
            <div class="stat stat-overdue"><dt>已逾期</dt><dd id="overdueCount">0</dd></div>
        </dl>

        <div class="panels">
            <section class="panel" aria-labelledby="itemsHeading">
                <h2 id="itemsHeading">物品清单</h2>
                <form class="add-form" onsubmit="addItem(event)">
                    <label for="itemName">物品名称</label>
                    <div class="input-row">
                        <input id="itemName" type="text" placeholder="例如：充电线" required>
                        <button type="submit">新增物品</button>
                    </div>
                </form>
                <p class="empty-state" id="emptyItems" hidden>清单是空的，可以在上方新增物品。</p>
                <ul class="item-list" id="itemList" aria-label="物品"></ul>
            </section>

            <section class="panel" aria-labelledby="recordsHeading">
                <h2 id="recordsHeading">最近记录</h2>
                <p class="empty-state" id="emptyRecords">借出、归还或删除物品后，记录会显示在这里。</p>
                <ul class="record-list" id="recordList" aria-label="操作记录"></ul>
            </section>
        </div>
    </main>

    <dialog id="borrowDialog" aria-labelledby="borrowHeading">
        <form id="borrowForm" onsubmit="borrowItem(event)">
            <h2 id="borrowHeading">登记借出</h2>
            <p class="dialog-item" id="borrowItemName"></p>
            <label for="borrowerName">借用人</label>
            <input id="borrowerName" type="text" placeholder="输入借用人姓名" required autofocus>
            <label for="dueDate">应还日期 <span>选填</span></label>
            <input id="dueDate" type="date">
            <div class="dialog-actions">
                <button class="secondary" id="cancelBorrow" type="button">取消</button>
                <button type="submit">确认借出</button>
            </div>
        </form>
    </dialog>

    <dialog id="deleteDialog" aria-labelledby="deleteHeading" aria-describedby="deleteMessage">
        <form method="dialog">
            <h2 id="deleteHeading">删除物品</h2>
            <p class="dialog-item" id="deleteMessage"></p>
            <p class="delete-warning" id="deleteWarning" hidden>请再确认一次。删除后，物品会从清单移除，之前的借还记录仍可查看。</p>
            <div class="dialog-actions">
                <button class="secondary" id="cancelDelete" type="submit" value="cancel" autofocus>取消</button>
                <button class="danger-solid" id="continueDelete" type="button">继续删除</button>
                <button class="danger-solid" id="confirmDelete" type="submit" value="delete" hidden disabled>确认删除</button>
            </div>
        </form>
    </dialog>

    <script>
let items = [];
let records = [];
let itemToBorrow = null;
let itemToDelete = null;
const itemList = document.getElementById("itemList");
const borrowDialog = document.getElementById("borrowDialog");
const deleteDialog = document.getElementById("deleteDialog");
const deleteWarning = document.getElementById("deleteWarning");
const continueDeleteButton = document.getElementById("continueDelete");
const confirmDeleteButton = document.getElementById("confirmDelete");

// 问后端要最新的物品和记录，然后重画整个页面
async function refresh() {
    const res = await fetch("/api/state");
    const data = await res.json();
    items = data.items;
    records = data.records;
    renderItems();
    renderRecords();
}

function renderRecords() {
    const list = document.getElementById("recordList");
    list.replaceChildren();
    for (const record of records) {
        const row = document.createElement("li");
        row.textContent = record.createdAt + " · " + record.text;
        list.appendChild(row);
    }
    document.getElementById("emptyRecords").hidden = records.length > 0;
}

// 往后端发一个「要做某事」的请求
function post(url, data) {
    return fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded; charset=utf-8" },
        body: new URLSearchParams(data)
    });
}

function isOverdue(item) {
    if (!item.borrower || !item.dueDate) return false;
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    return new Date(item.dueDate + "T00:00:00") < today;
}

function openBorrowDialog(item) {
    itemToBorrow = item;
    document.getElementById("borrowForm").reset();
    document.getElementById("borrowItemName").textContent = item.name;
    borrowDialog.showModal();
}

async function borrowItem(event) {
    event.preventDefault();
    const input = document.getElementById("borrowerName");
    const borrower = input.value.trim();
    if (!borrower) {
        input.focus();
        return;
    }
    if (!itemToBorrow || itemToBorrow.borrower) return;

    const item = itemToBorrow;
    itemToBorrow = null;
    await post("/api/items/" + item.id + "/borrow", {
        borrower: borrower,
        dueDate: document.getElementById("dueDate").value
    });
    borrowDialog.close();
    await refresh();
}

async function returnItem(item) {
    await post("/api/items/" + item.id + "/return", {});
    await refresh();
}

function openDeleteDialog(item) {
    itemToDelete = item;
    deleteDialog.returnValue = "";
    deleteWarning.hidden = true;
    continueDeleteButton.hidden = false;
    confirmDeleteButton.hidden = true;
    confirmDeleteButton.disabled = true;
    const borrower = item.borrower ? " 当前借用人：" + item.borrower + "。" : "";
    document.getElementById("deleteMessage").textContent = "确定从清单删除「" + item.name + "」？" + borrower;
    deleteDialog.showModal();
}

function showItem(item) {
    const row = document.createElement("li");
    row.className = "item-row";
    const details = document.createElement("div");
    const heading = document.createElement("div");
    heading.className = "item-heading";
    const name = document.createElement("strong");
    name.textContent = item.name;
    const badge = document.createElement("span");
    const button = document.createElement("button");
    button.type = "button";

    if (item.borrower) {
        row.classList.add("is-borrowed");
        const late = isOverdue(item);
        badge.className = late ? "badge overdue" : "badge borrowed";
        badge.textContent = late ? "已逾期" : "已借出";
        const description = document.createElement("p");
        description.className = "item-meta";
        description.textContent = "借用人 " + item.borrower;
        if (item.dueDate) description.textContent += " · 应还 " + item.dueDate;
        details.appendChild(description);
        button.className = "secondary";
        button.textContent = "归还";
        button.onclick = function () { returnItem(item); };
    } else {
        badge.className = "badge available";
        badge.textContent = "可借";
        button.textContent = "借出";
        button.onclick = function () { openBorrowDialog(item); };
    }

    heading.appendChild(name);
    heading.appendChild(badge);
    details.prepend(heading);
    row.appendChild(details);

    const deleteButton = document.createElement("button");
    deleteButton.type = "button";
    deleteButton.className = "danger";
    deleteButton.textContent = "删除";
    deleteButton.setAttribute("aria-label", "删除 " + item.name);
    deleteButton.onclick = function () { openDeleteDialog(item); };

    const actions = document.createElement("div");
    actions.className = "item-actions";
    actions.appendChild(button);
    actions.appendChild(deleteButton);
    row.appendChild(actions);
    itemList.appendChild(row);
}

function renderItems() {
    itemList.replaceChildren();
    document.getElementById("emptyItems").hidden = items.length > 0;
    for (const item of items) {
        showItem(item);
    }
    const borrowed = items.filter(item => item.borrower).length;
    document.getElementById("totalCount").textContent = items.length;
    document.getElementById("availableCount").textContent = items.length - borrowed;
    document.getElementById("borrowedCount").textContent = borrowed;
    document.getElementById("overdueCount").textContent = items.filter(isOverdue).length;
}

async function addItem(event) {
    event.preventDefault();
    const input = document.getElementById("itemName");
    const name = input.value.trim();
    if (name === "") return;

    await post("/api/items", { name: name });
    input.value = "";
    await refresh();
}

document.getElementById("cancelBorrow").onclick = function () {
    borrowDialog.close();
};

continueDeleteButton.onclick = function () {
    deleteWarning.hidden = false;
    continueDeleteButton.hidden = true;
    confirmDeleteButton.hidden = false;
    confirmDeleteButton.disabled = false;
    document.getElementById("cancelDelete").focus();
};

deleteDialog.addEventListener("close", async function () {
    const item = itemToDelete;
    itemToDelete = null;
    if (!item || deleteDialog.returnValue !== "delete" || confirmDeleteButton.disabled) return;

    await fetch("/api/items/" + item.id, { method: "DELETE" });
    await refresh();
});

refresh();
    </script>
</body>
</html>
