<meta charset="UTF-8">
<h1>校园淋浴助手</h1>
<p id="status">1号浴室：空闲</p>
<button onclick="starShower()">开始使用</button>
<button onclick="endShower()">结束使用</button>
<script>
    let startTime = 0;

    function starShower() {
        if (startTime !== 0) return;

        startTime = Date.now();
        document.getElementById("status").textContent = "1号浴室：已占用";
    }

    function endShower() {
        if (startTime === 0) return;

        let seconds = Math.floor((Date.now() - startTime) / 1000);
        let liters=20;
        let pricePerLiter=0.05;
        let amount=(liters*pricePerLiter).toFixed(2);
        document.getElementById("status").textContent=
        "1号浴室：空闲，本次使用 " + seconds + " 秒，模拟用水 " +
    liters + " 升，模拟费用 " + amount + " 元";
        startTime = 0;
    }
</script>
